<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Pomodoro Timer</title>
<style>
:root {
    --primary-color: rgba(255, 255, 255, 0.15);
    --secondary-color: rgba(255, 255, 255, 0.05);
    --accent-color: #ff6b6b;
    --text-color: #ffffff;
    --bg-color: #0f0f0f;
    --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    --transition-speed: 0.3s;
    --blur-strength: 20px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    font-family: var(--font-family);
    background: var(--bg-color);
    color: var(--text-color);
    overflow-x: hidden;
}

button {
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
    font: inherit;
}

input, select {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    outline: none;
}

a {
    text-decoration: none;
    color: inherit;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app-container {
    backdrop-filter: blur(var(--blur-strength));
    background: var(--primary-color);
    border-radius: 20px;
    box-shadow: 0 8px 32px var(--secondary-color);
    padding: 40px;
    max-width: 400px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all var(--transition-speed) ease;
}

.timer-display {
    font-size: 4rem;
    font-weight: bold;
    margin-bottom: 20px;
    user-select: none;
}

.session-type {
    font-size: 1.2rem;
    margin-bottom: 20px;
    color: var(--accent-color);
}

.controls {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
}

button.control-btn {
    padding: 12px 20px;
    border-radius: 12px;
    background: var(--accent-color);
    color: var(--text-color);
    font-weight: bold;
    transition: background var(--transition-speed);
}

button.control-btn:hover {
    background: #ff5252;
}

.settings-panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 20px;
}

.settings-panel input[type="number"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    background: var(--secondary-color);
    text-align: center;
}

input:focus, button:focus {
    outline: 2px solid rgba(255,255,255,0.12);
    outline-offset: 2px;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
}

button.control-btn:active {
    animation: pulse 0.2s ease-in-out;
}

.fade-in {
    opacity: 0;
    animation: fadeIn 0.5s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

body.fullscreen-mode {
    background: #000;
}

body.fullscreen-mode .app-container {
    max-width: 100%;
    width: 100%;
    height: 100%;
    border-radius: 0;
    justify-content: center;
}

</style>
</head>
<body>
<div class="app-container fade-in">
    <div class="session-type" id="session-type">Pomodoro</div>
    <div class="timer-display" id="timer-display" role="status" aria-live="polite">25:00</div>
    <div class="controls">
        <button class="control-btn" id="start-btn" aria-label="Start timer">Start</button>
        <button class="control-btn" id="pause-btn" aria-label="Pause timer">Pause</button>
        <button class="control-btn" id="reset-btn" aria-label="Reset timer">Reset</button>
    </div>
    <div class="settings-panel">
        <label>Pomodoro (minutes):
            <input type="number" id="pomodoro-duration" min="1" max="420" value="25" aria-label="Pomodoro duration in minutes">
        </label>
        <label>Short Break (minutes):
            <input type="number" id="short-break-duration" min="1" max="60" value="5" aria-label="Short break duration in minutes">
        </label>
        <label>Long Break (minutes):
            <input type="number" id="long-break-duration" min="1" max="60" value="15" aria-label="Long break duration in minutes">
        </label>
        <label>Sessions before Long Break:
            <input type="number" id="sessions-before-long-break" min="1" max="10" value="4" aria-label="Sessions before a long break">
        </label>
        <label>Volume:
            <input type="range" id="volume-control" min="0" max="1" step="0.01" value="0.5" aria-label="Background music volume">
        </label>
        <label>
            <input type="checkbox" id="mute-toggle" aria-label="Mute background audio"> Mute
        </label>
    </div>
</div>
<script>
/* Load persisted settings (defensive parsing) */
let storedPomodoro = parseInt(localStorage.getItem('pomodoroDuration'));
let storedShortBreak = parseInt(localStorage.getItem('shortBreakDuration'));
let storedLongBreak = parseInt(localStorage.getItem('longBreakDuration'));
let storedSessionsBeforeLong = parseInt(localStorage.getItem('sessionsBeforeLongBreak'));
let storedVolume = parseFloat(localStorage.getItem('volume'));
let storedMuted = (localStorage.getItem('muted') === 'true');

let pomodoroDuration = Number.isInteger(storedPomodoro) ? storedPomodoro : 25;
let shortBreakDuration = Number.isInteger(storedShortBreak) ? storedShortBreak : 5;
let longBreakDuration = Number.isInteger(storedLongBreak) ? storedLongBreak : 15;
let sessionsBeforeLongBreak = Number.isInteger(storedSessionsBeforeLong) ? storedSessionsBeforeLong : 4;

let sessionType = 'Pomodoro';
let sessionCount = 0;
let timer = null;
let remainingTime = pomodoroDuration * 60;

const timerDisplay = document.getElementById('timer-display');
const sessionTypeDisplay = document.getElementById('session-type');

function formatTime(seconds) {
    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    return `${mins}:${secs}`;
}

function updateDisplay() {
    timerDisplay.textContent = formatTime(remainingTime);
    sessionTypeDisplay.textContent = sessionType;
}

function startTimer() {
    if (!timer) {
        timer = setInterval(() => {
            if (remainingTime > 0) {
                remainingTime--;
                updateDisplay();
            } else {
                clearInterval(timer);
                timer = null;
                handleSessionEnd();
            }
        }, 1000);
    }
}

function pauseTimer() {
    if (timer) {
        clearInterval(timer);
        timer = null;
    }
}

function resetTimer() {
    pauseTimer();
    if (sessionType === 'Pomodoro') {
        remainingTime = pomodoroDuration * 60;
    } else if (sessionType === 'Short Break') {
        remainingTime = shortBreakDuration * 60;
    } else {
        remainingTime = longBreakDuration * 60;
    }
    updateDisplay();
}

/* Audio elements */
const alarmAudio = new Audio('https://www.soundjay.com/buttons/sounds/beep-07.mp3');
alarmAudio.loop = false;

const bgMusic = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
bgMusic.loop = true;

/* DOM elements */
const startBtn = document.getElementById('start-btn');
const pauseBtn = document.getElementById('pause-btn');
const resetBtn = document.getElementById('reset-btn');

const pomodoroInput = document.getElementById('pomodoro-duration');
const shortBreakInput = document.getElementById('short-break-duration');
const longBreakInput = document.getElementById('long-break-duration');
const sessionsInput = document.getElementById('sessions-before-long-break');

const volumeControl = document.getElementById('volume-control');
const muteToggle = document.getElementById('mute-toggle');

/* Initialize inputs from stored values so UI matches persisted settings */
pomodoroInput.value = pomodoroDuration;
shortBreakInput.value = shortBreakDuration;
longBreakInput.value = longBreakDuration;
sessionsInput.value = sessionsBeforeLongBreak;

/* Initialize volume/mute from storage */
if (!Number.isFinite(storedVolume)) {
    storedVolume = parseFloat(volumeControl.value) || 0.5;
}
bgMusic.volume = Math.min(1, Math.max(0, storedVolume));
volumeControl.value = bgMusic.volume;

bgMusic.muted = !!storedMuted;
muteToggle.checked = !!storedMuted;

/* Try to start background music (many browsers may block autoplay) */
bgMusic.play().catch(()=>{/* Autoplay blocked; it's fine */});

/* Event listeners for controls */
startBtn.addEventListener('click', startTimer);
pauseBtn.addEventListener('click', pauseTimer);
resetBtn.addEventListener('click', resetTimer);

/* Persist changes when user updates settings and adjust timer if needed */
pomodoroInput.addEventListener('change', () => {
    const val = Math.max(1, Math.min(420, parseInt(pomodoroInput.value) || 25));
    pomodoroDuration = val;
    localStorage.setItem('pomodoroDuration', pomodoroDuration);
    pomodoroInput.value = pomodoroDuration;
    if (sessionType === 'Pomodoro') resetTimer();
});

shortBreakInput.addEventListener('change', () => {
    const val = Math.max(1, Math.min(60, parseInt(shortBreakInput.value) || 5));
    shortBreakDuration = val;
    localStorage.setItem('shortBreakDuration', shortBreakDuration);
    shortBreakInput.value = shortBreakDuration;
    if (sessionType === 'Short Break') resetTimer();
});

longBreakInput.addEventListener('change', () => {
    const val = Math.max(1, Math.min(60, parseInt(longBreakInput.value) || 15));
    longBreakDuration = val;
    localStorage.setItem('longBreakDuration', longBreakDuration);
    longBreakInput.value = longBreakDuration;
    if (sessionType === 'Long Break') resetTimer();
});

sessionsInput.addEventListener('change', () => {
    const val = Math.max(1, Math.min(10, parseInt(sessionsInput.value) || 4));
    sessionsBeforeLongBreak = val;
    localStorage.setItem('sessionsBeforeLongBreak', sessionsBeforeLongBreak);
    sessionsInput.value = sessionsBeforeLongBreak;
});

/* Volume and mute */
volumeControl.addEventListener('input', () => {
    const vol = Math.min(1, Math.max(0, parseFloat(volumeControl.value) || 0));
    bgMusic.volume = vol;
    localStorage.setItem('volume', vol);
});

muteToggle.addEventListener('change', () => {
    bgMusic.muted = muteToggle.checked;
    localStorage.setItem('muted', bgMusic.muted ? 'true' : 'false');
});

/* Stats */
let streak = parseInt(localStorage.getItem('streak')) || 0;
let dailyFocus = parseInt(localStorage.getItem('dailyFocus')) || 0;

function updateStats() {
    localStorage.setItem('streak', streak);
    localStorage.setItem('dailyFocus', dailyFocus);
}

/* Consolidated session end handler (single implementation) */
function handleSessionEnd() {
    if (sessionType === 'Pomodoro') {
        sessionCount++;
        // Keep dailyFocus in minutes
        dailyFocus += pomodoroDuration;
        streak++;
        if (sessionCount % sessionsBeforeLongBreak === 0) {
            sessionType = 'Long Break';
            remainingTime = longBreakDuration * 60;
        } else {
            sessionType = 'Short Break';
            remainingTime = shortBreakDuration * 60;
        }
    } else {
        sessionType = 'Pomodoro';
        remainingTime = pomodoroDuration * 60;
    }

    updateStats();
    updateDisplay();

    // Play alarm (safe play)
    try {
        alarmAudio.currentTime = 0;
        alarmAudio.play().catch(()=>{});
    } catch (e) { /* ignore play errors */ }

    // Automatically resume next session
    startTimer();
}

/* Keyboard shortcut: space toggles start/pause */
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        // If an input or button is focused, don't intercept
        const active = document.activeElement;
        const isInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
        if (isInput) return;
        e.preventDefault();
        if (timer) {
            pauseTimer();
        } else {
            startTimer();
        }
    }
});

/* Update document title to show remaining time while running */
function updatePageTitle() {
    if (timer) {
        document.title = `${formatTime(remainingTime)} - ${sessionType}`;
    } else {
        document.title = `Pomodoro Timer`;
    }
}
updatePageTitle();
setInterval(updatePageTitle, 1000);

/* Toggle fullscreen mode on double-click of timer */
document.getElementById('timer-display').addEventListener('dblclick', () => {
    document.body.classList.toggle('fullscreen-mode');
});

/* Initial display update */
updateDisplay();
</script>
</body>
</html>
