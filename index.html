<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffd93d;
            --dark: #0a0e27;
            --darker: #050812;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-light: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: #b0b3c1;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .timer-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .timer-mode {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .timer-circle {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1) 0%, rgba(78, 205, 196, 0.1) 100%);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.1);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 107, 107, 0.1); }
            50% { box-shadow: 0 0 50px rgba(255, 107, 107, 0.2); }
        }

        .timer-value {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -2px;
            font-family: 'Monaco', monospace;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .timer-value.break {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            background: var(--surface-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, #ff5252 100%);
            border: none;
            color: white;
        }

        .btn.primary:hover {
            background: linear-gradient(135deg, #ff5252 0%, #ff3838 100%);
            box-shadow: 0 12px 24px rgba(255, 107, 107, 0.3);
        }

        .btn.secondary {
            background: linear-gradient(135deg, var(--secondary) 0%, #45b7aa 100%);
            border: none;
            color: white;
        }

        .btn.secondary:hover {
            background: linear-gradient(135deg, #45b7aa 0%, #3aa39f 100%);
            box-shadow: 0 12px 24px rgba(78, 205, 196, 0.3);
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group:last-child {
            margin-bottom: 0;
        }

        .label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-number {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            width: 80px;
            transition: all 0.3s ease;
            font-family: 'Monaco', monospace;
        }

        .input-number:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.2);
            background: var(--surface-light);
        }

        .slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--surface);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #ff5252 100%);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #ff5252 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        .volume-value {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 30px;
            text-align: right;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .stat-item {
            background: var(--surface);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--surface);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, #ff5252 100%);
            border-color: transparent;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .fullscreen-btn:hover {
            background: var(--surface-light);
            transform: scale(1.1);
        }

        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            gap: 40px;
        }

        .fullscreen-mode.active {
            opacity: 1;
            pointer-events: auto;
        }

        .fullscreen-timer {
            font-size: 120px;
            font-weight: 700;
            letter-spacing: -4px;
            font-family: 'Monaco', monospace;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .fullscreen-timer.break {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .fullscreen-label {
            font-size: 24px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fullscreen-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .fullscreen-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 24px;
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            pointer-events: none;
            z-index: 999;
            transition: all 0.3s ease;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                max-width: 100%;
            }

            .timer-circle {
                width: 160px;
                height: 160px;
            }

            .timer-value {
                font-size: 44px;
            }

            .fullscreen-timer {
                font-size: 80px;
            }
        }
    </style>
</head>
<body>
    <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

    <div class="fullscreen-mode" id="fullscreenMode">
        <button class="fullscreen-close" id="fullscreenClose">✕</button>
        <div style="text-align: center;">
            <div class="fullscreen-label" id="fullscreenLabel">Focus</div>
            <div class="fullscreen-timer" id="fullscreenTimer">25:00</div>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" id="timerTab">Timer</button>
            <button class="tab-btn" id="settingsTab">Settings</button>
            <button class="tab-btn" id="statsTab">Stats</button>
        </div>

        <!-- Timer Tab -->
        <div class="tab-content active" id="timerContent">
            <div class="card">
                <div class="timer-display">
                    <div class="timer-mode" id="timerMode">Focus Time</div>
                    <div class="timer-circle" id="timerCircle">
                        <div class="timer-value" id="timerValue">25:00</div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn primary" id="startBtn">Start</button>
                    <button class="btn secondary" id="pauseBtn" style="display: none;">Pause</button>
                    <button class="btn" id="resetBtn">Reset</button>
                </div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div class="tab-content" id="settingsContent">
            <div class="card">
                <div class="settings-group">
                    <label class="label">Pomodoro Duration (minutes)</label>
                    <div class="input-group">
                        <input type="number" class="input-number" id="pomodoroInput" min="1" max="420" value="25">
                        <span style="color: var(--text-muted); font-size: 12px;">1 - 420</span>
                    </div>
                </div>

                <div class="settings-group">
                    <label class="label">Short Break (minutes)</label>
                    <div class="input-group">
                        <input type="number" class="input-number" id="shortBreakInput" min="1" max="60" value="5">
                        <span style="color: var(--text-muted); font-size: 12px;">1 - 60</span>
                    </div>
                </div>

                <div class="settings-group">
                    <label class="label">Long Break (minutes)</label>
                    <div class="input-group">
                        <input type="number" class="input-number" id="longBreakInput" min="1" max="120" value="15">
                        <span style="color: var(--text-muted); font-size: 12px;">1 - 120</span>
                    </div>
                </div>

                <div class="settings-group">
                    <label class="label">Volume</label>
                    <div class="input-group">
                        <input type="range" class="slider" id="volumeSlider" min="0" max="100" value="50">
                        <button class="btn" id="muteBtn" style="flex: 0; padding: 8px 12px;">🔊</button>
                        <span class="volume-value" id="volumeValue">50%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats Tab -->
        <div class="tab-content" id="statsContent">
            <div class="card">
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="sessionsCount">0</div>
                        <div class="stat-label">Sessions Today</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="focusTime">0m</div>
                        <div class="stat-label">Focus Time</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="streakCount">0</div>
                        <div class="stat-label">Day Streak</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="avgTime">25m</div>
                        <div class="stat-label">Avg Session</div>
                    </div>
                </div>
                <button class="btn" id="resetStatsBtn" style="width: 100%; margin-top: 16px;">Reset Stats</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        const app = {
            state: {
                timeLeft: 25 * 60,
                totalTime: 25 * 60,
                isRunning: false,
                isBreak: false,
                isLongBreak: false,
                volume: 0.5,
                sessionsCompleted: 0,
                focusTimeToday: 0,
                lastStatsDate: new Date().toDateString(),
                dayStreak: 0,
            },

            config: {
                pomodoroMinutes: 25,
                shortBreakMinutes: 5,
                longBreakMinutes: 15,
                sessionsUntilLongBreak: 4,
            },

            elements: {},
            timers: { countdown: null },
            isMuted: false,

            init() {
                this.loadSettings();
                this.cacheElements();
                this.setupEventListeners();
                this.updateDisplay();
            },

            loadSettings() {
                try {
                    const saved = localStorage.getItem('pomodoroSettings');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.config = { ...this.config, ...data.config };
                        this.state = { ...this.state, ...data.state };
                    }

                    const today = new Date().toDateString();
                    if (this.state.lastStatsDate !== today) {
                        this.state.sessionsCompleted = 0;
                        this.state.focusTimeToday = 0;
                        this.state.lastStatsDate = today;
                    }

                    this.state.timeLeft = this.config.pomodoroMinutes * 60;
                    this.state.totalTime = this.state.timeLeft;
                } catch (e) {
                    console.log('Error loading settings');
                }
            },

            saveSettings() {
                try {
                    localStorage.setItem('pomodoroSettings', JSON.stringify({
                        config: this.config,
                        state: this.state,
                    }));
                } catch (e) {
                    console.log('Error saving settings');
                }
            },

            cacheElements() {
                this.elements = {
                    timerValue: document.getElementById('timerValue'),
                    timerMode: document.getElementById('timerMode'),
                    timerCircle: document.getElementById('timerCircle'),
                    startBtn: document.getElementById('startBtn'),
                    pauseBtn: document.getElementById('pauseBtn'),
                    resetBtn: document.getElementById('resetBtn'),
                    pomodoroInput: document.getElementById('pomodoroInput'),
                    shortBreakInput: document.getElementById('shortBreakInput'),
                    longBreakInput: document.getElementById('longBreakInput'),
                    volumeSlider: document.getElementById('volumeSlider'),
                    volumeValue: document.getElementById('volumeValue'),
                    muteBtn: document.getElementById('muteBtn'),
                    sessionsCount: document.getElementById('sessionsCount'),
                    focusTime: document.getElementById('focusTime'),
                    streakCount: document.getElementById('streakCount'),
                    avgTime: document.getElementById('avgTime'),
                    fullscreenBtn: document.getElementById('fullscreenBtn'),
                    fullscreenMode: document.getElementById('fullscreenMode'),
                    fullscreenTimer: document.getElementById('fullscreenTimer'),
                    fullscreenLabel: document.getElementById('fullscreenLabel'),
                    fullscreenClose: document.getElementById('fullscreenClose'),
                    timerTab: document.getElementById('timerTab'),
                    settingsTab: document.getElementById('settingsTab'),
                    statsTab: document.getElementById('statsTab'),
                    timerContent: document.getElementById('timerContent'),
                    settingsContent: document.getElementById('settingsContent'),
                    statsContent: document.getElementById('statsContent'),
                    resetStatsBtn: document.getElementById('resetStatsBtn'),
                    notification: document.getElementById('notification'),
                };

                this.updateInputs();
            },

            updateInputs() {
                this.elements.pomodoroInput.value = this.config.pomodoroMinutes;
                this.elements.shortBreakInput.value = this.config.shortBreakMinutes;
                this.elements.longBreakInput.value = this.config.longBreakMinutes;
                this.elements.volumeSlider.value = this.state.volume * 100;
                this.updateVolumeDisplay();
            },

            setupEventListeners() {
                this.elements.startBtn.addEventListener('click', () => this.start());
                this.elements.pauseBtn.addEventListener('click', () => this.pause());
                this.elements.resetBtn.addEventListener('click', () => this.reset());

                this.elements.pomodoroInput.addEventListener('change', (e) => {
                    const val = Math.max(1, Math.min(420, parseInt(e.target.value) || 25));
                    this.config.pomodoroMinutes = val;
                    e.target.value = val;
                    if (!this.state.isRunning && !this.state.isBreak) {
                        this.state.timeLeft = val * 60;
                        this.state.totalTime = this.state.timeLeft;
                        this.updateDisplay();
                    }
                    this.saveSettings();
                });

                this.elements.shortBreakInput.addEventListener('change', (e) => {
                    const val = Math.max(1, Math.min(60, parseInt(e.target.value) || 5));
                    this.config.shortBreakMinutes = val;
                    e.target.value = val;
                    this.saveSettings();
                });

                this.elements.longBreakInput.addEventListener('change', (e) => {
                    const val = Math.max(1, Math.min(120, parseInt(e.target.value) || 15));
                    this.config.longBreakMinutes = val;
                    e.target.value = val;
                    this.saveSettings();
                });

                this.elements.volumeSlider.addEventListener('input', (e) => {
                    this.state.volume = parseInt(e.target.value) / 100;
                    this.updateVolumeDisplay();
                    this.saveSettings();
                });

                this.elements.muteBtn.addEventListener('click', () => {
                    this.isMuted = !this.isMuted;
                    this.elements.muteBtn.textContent = this.isMuted ? '🔇' : '🔊';
                });

                this.elements.fullscreenBtn.addEventListener('click', () => {
                    this.elements.fullscreenMode.classList.add('active');
                });

                this.elements.fullscreenClose.addEventListener('click', () => {
                    this.elements.fullscreenMode.classList.remove('active');
                });

                this.elements.timerTab.addEventListener('click', () => this.switchTab('timer'));
                this.elements.settingsTab.addEventListener('click', () => this.switchTab('settings'));
                this.elements.statsTab.addEventListener('click', () => this.switchTab('stats'));

                this.elements.resetStatsBtn.addEventListener('click', () => {
                    this.state.sessionsCompleted = 0;
                    this.state.focusTimeToday = 0;
                    this.state.dayStreak = 0;
                    this.saveSettings();
                    this.updateStatsDisplay();
                    this.showNotification('Stats reset!');
                });

                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.state.isRunning ? this.pause() : this.start();
                    }
                    if (e.code === 'KeyR') {
                        this.reset();
                    }
                });
            },

            switchTab(tab) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

                if (tab === 'timer') {
                    this.elements.timerTab.classList.add('active');
                    this.elements.timerContent.classList.add('active');
                } else if (tab === 'settings') {
                    this.elements.settingsTab.classList.add('active');
                    this.elements.settingsContent.classList.add('active');
                } else if (tab === 'stats') {
                    this.elements.statsTab.classList.add('active');
                    this.elements.statsContent.classList.add('active');
                    this.updateStatsDisplay();
                }
            },

            updateVolumeDisplay() {
                this.elements.volumeValue.textContent = Math.round(this.state.volume * 100) + '%';
            },

            updateStatsDisplay() {
                this.elements.sessionsCount.textContent = this.state.sessionsCompleted;
                const minutes = this.state.focusTimeToday;
                this.elements.focusTime.textContent = minutes > 0 ? minutes + 'm' : '0m';
                this.elements.streakCount.textContent = this.state.dayStreak;
                const avgSession = this.state.sessionsCompleted > 0 
                    ? Math.round(this.state.focusTimeToday / this.state.sessionsCompleted) 
                    : this.config.pomodoroMinutes;
                this.elements.avgTime.textContent = avgSession + 'm';
            },

            updateDisplay() {
                const mins = Math.floor(this.state.timeLeft / 60);
                const secs = this.state.timeLeft % 60;
                const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                this.elements.timerValue.textContent = timeStr;
                this.elements.fullscreenTimer.textContent = timeStr;

                const label = this.state.isBreak 
                    ? (this.state.isLongBreak ? 'Long Break' : 'Short Break')
                    : 'Focus Time';
                this.elements.timerMode.textContent = label;
                this.elements.fullscreenLabel.textContent = label;

                if (this.state.isBreak) {
                    this.elements.timerValue.classList.add('break');
                    this.elements.fullscreenTimer.classList.add('break');
                } else {
                    this.elements.timerValue.classList.remove('break');
                    this.elements.fullscreenTimer.classList.remove('break');
                }

                document.title = `${timeStr} - Pomodoro Timer`;
            },

            start() {
                if (this.state.isRunning) return;

                this.state.isRunning = true;
                this.elements.startBtn.style.display = 'none';
                this.elements.pauseBtn.style.display = 'block';

                this.timers.countdown = setInterval(() => {
                    this.state.timeLeft--;

                    if (this.state.timeLeft <= 0) {
                        this.completeSession();
                    }

                    this.updateDisplay();
                }, 1000);
            },

            pause() {
                this.state.isRunning = false;
                this.elements.startBtn.style.display = 'block';
                this.elements.pauseBtn.style.display = 'none';
                clearInterval(this.timers.countdown);
            },

            reset() {
                this.pause();
                this.state.isBreak = false;
                this.state.isLongBreak = false;
                this.state.timeLeft = this.config.pomodoroMinutes * 60;
                this.state.totalTime = this.state.timeLeft;
                this.updateDisplay();
            },
