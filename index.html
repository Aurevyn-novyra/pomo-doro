<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #050812 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .timer-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .timer-mode {
            font-size: 12px;
            color: #b0b3c1;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .timer-circle {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1) 0%, rgba(78, 205, 196, 0.1) 100%);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 107, 107, 0.1); }
            50% { box-shadow: 0 0 40px rgba(255, 107, 107, 0.2); }
        }

        .timer-value {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -2px;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .timer-value.break {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn.primary {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
            border: none;
        }

        .btn.primary:hover {
            box-shadow: 0 12px 24px rgba(255, 107, 107, 0.3);
        }

        .btn.secondary {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7aa 100%);
            border: none;
        }

        .btn.secondary:hover {
            box-shadow: 0 12px 24px rgba(78, 205, 196, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 12px;
            color: #b0b3c1;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-number {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            width: 80px;
        }

        .input-number:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.2);
        }

        .slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
            border: none;
        }

        .volume-value {
            font-size: 12px;
            color: #b0b3c1;
            min-width: 35px;
            text-align: right;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #ff6b6b;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #b0b3c1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #b0b3c1;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
            border-color: transparent;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
        }

        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a0e27 0%, #050812 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .fullscreen-mode.active {
            opacity: 1;
            pointer-events: auto;
        }

        .fullscreen-timer {
            font-size: 120px;
            font-weight: 700;
            letter-spacing: -4px;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .fullscreen-timer.break {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .fullscreen-label {
            font-size: 24px;
            color: #b0b3c1;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fullscreen-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .fullscreen-close:hover {
            transform: scale(1.1);
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 24px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            pointer-events: none;
            z-index: 999;
            transition: all 0.3s ease;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                max-width: 100%;
            }

            .timer-circle {
                width: 160px;
                height: 160px;
            }

            .timer-value {
                font-size: 44px;
            }

            .fullscreen-timer {
                font-size: 80px;
            }
        }
    </style>
</head>
<body>
    <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

    <div class="fullscreen-mode" id="fullscreenMode">
        <button class="fullscreen-close" id="fullscreenClose">✕</button>
        <div>
            <div class="fullscreen-label" id="fullscreenLabel">Focus</div>
            <div class="fullscreen-timer" id="fullscreenTimer">25:00</div>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" data-tab="timer">Timer</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
            <button class="tab-btn" data-tab="stats">Stats</button>
        </div>

        <div class="tab-content active" id="timerTab">
            <div class="card">
                <div class="timer-display">
                    <div class="timer-mode" id="timerMode">Focus Time</div>
                    <div class="timer-circle">
                        <div class="timer-value" id="timerValue">25:00</div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn primary" id="startBtn">Start</button>
                    <button class="btn secondary" id="pauseBtn" style="display: none;">Pause</button>
                    <button class="btn" id="resetBtn">Reset</button>
                </div>
            </div>
        </div>

        <div class="tab-content" id="settingsTab">
            <div class="card">
                <div class="settings-group">
                    <label class="label">Pomodoro (min)</label>
                    <div class="input-group">
                        <input type="number" class="input-number" id="pomodoroInput" min="1" max="420" value="25">
                        <span style="color: #b0b3c1; font-size: 12px;">1-420</span>
                    </div>
                </div>

                <div class="settings-group">
                    <label class="label">Short Break (min)</label>
                    <div class="input-group">
                        <input type="number" class="input-number" id="shortBreakInput" min="1" max="60" value="5">
                        <span style="color: #b0b3c1; font-size: 12px;">1-60</span>
                    </div>
                </div>

                <div class="settings-group">
                    <label class="label">Long Break (min)</label>
                    <div class="input-group">
                        <input type="number" class="input-number" id="longBreakInput" min="1" max="120" value="15">
                        <span style="color: #b0b3c1; font-size: 12px;">1-120</span>
                    </div>
                </div>

                <div class="settings-group">
                    <label class="label">Volume</label>
                    <div class="input-group">
                        <input type="range" class="slider" id="volumeSlider" min="0" max="100" value="50">
                        <button class="btn" id="muteBtn" style="flex: 0; padding: 8px 12px; border-radius: 8px;">🔊</button>
                        <span class="volume-value" id="volumeValue">50%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="statsTab">
            <div class="card">
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="sessionsCount">0</div>
                        <div class="stat-label">Sessions</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="focusTime">0m</div>
                        <div class="stat-label">Focus Time</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="streakCount">0</div>
                        <div class="stat-label">Streak</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="avgTime">0m</div>
                        <div class="stat-label">Avg Session</div>
                    </div>
                </div>
                <button class="btn" id="resetStatsBtn" style="width: 100%; margin-top: 16px;">Reset Stats</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        const app = {
            state: {
                timeLeft: 1500,
                totalTime: 1500,
                isRunning: false,
                isBreak: false,
                isLongBreak: false,
                volume: 0.5,
                sessionsCompleted: 0,
                focusTimeToday: 0,
                dayStreak: 0,
                lastDate: new Date().toDateString()
            },

            config: {
                pomodoroMinutes: 25,
                shortBreakMinutes: 5,
                longBreakMinutes: 15,
                sessionsUntilLongBreak: 4
            },

            countdownInterval: null,

            init() {
                this.loadData();
                this.cacheDOM();
                this.bindEvents();
                this.updateDisplay();
            },

            loadData() {
                try {
                    const saved = localStorage.getItem('pomodoroApp');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.state = Object.assign(this.state, data.state);
                        this.config = Object.assign(this.config, data.config);
                    }

                    const today = new Date().toDateString();
                    if (this.state.lastDate !== today) {
                        this.state.sessionsCompleted = 0;
                        this.state.focusTimeToday = 0;
                        this.state.lastDate = today;
                    }

                    if (this.state.isRunning) {
                        this.state.isRunning = false;
                    }

                    this.state.timeLeft = this.config.pomodoroMinutes * 60;
                    this.state.totalTime = this.state.timeLeft;
                } catch (e) {
                    console.error('Load error:', e);
                }
            },

            saveData() {
                try {
                    localStorage.setItem('pomodoroApp', JSON.stringify({
                        state: this.state,
                        config: this.config
                    }));
                } catch (e) {
                    console.error('Save error:', e);
                }
            },

            cacheDOM() {
                this.dom = {
                    timerValue: document.getElementById('timerValue'),
                    timerMode: document.getElementById('timerMode'),
                    startBtn: document.getElementById('startBtn'),
                    pauseBtn: document.getElementById('pauseBtn'),
                    resetBtn: document.getElementById('resetBtn'),
                    pomodoroInput: document.getElementById('pomodoroInput'),
                    shortBreakInput: document.getElementById('shortBreakInput'),
                    longBreakInput: document.getElementById('longBreakInput'),
                    volumeSlider: document.getElementById('volumeSlider'),
                    volumeValue: document.getElementById('volumeValue'),
                    muteBtn: document.getElementById('muteBtn'),
                    fullscreenBtn: document.getElementById('fullscreenBtn'),
                    fullscreenMode: document.getElementById('fullscreenMode'),
                    fullscreenClose: document.getElementById('fullscreenClose'),
                    fullscreenTimer: document.getElementById('fullscreenTimer'),
                    fullscreenLabel: document.getElementById('fullscreenLabel'),
                    sessionsCount: document.getElementById('sessionsCount'),
                    focusTime: document.getElementById('focusTime'),
                    streakCount: document.getElementById('streakCount'),
                    avgTime: document.getElementById('avgTime'),
                    resetStatsBtn: document.getElementById('resetStatsBtn'),
                    notification: document.getElementById('notification'),
                    tabButtons: document.querySelectorAll('.tab-btn'),
                    tabContents: document.querySelectorAll('.tab-content')
                };

                this.updateInputs();
            },

            updateInputs() {
                this.dom.pomodoroInput.value = this.config.pomodoroMinutes;
                this.dom.shortBreakInput.value = this.config.shortBreakMinutes;
                this.dom.longBreakInput.value = this.config.longBreakMinutes;
                this.dom.volumeSlider.value = this.state.volume * 100;
                this.dom.volumeValue.textContent = Math.round(this.state.volume * 100) + '%';
            },

            bindEvents() {
                this.dom.startBtn.addEventListener('click', () => this.start());
                this.dom.pauseBtn.addEventListener('click', () => this.pause());
                this.dom.resetBtn.addEventListener('click', () => this.reset());

                this.dom.pomodoroInput.addEventListener('change', (e) => {
                    const val = Math.max(1, Math.min(420, parseInt(e.target.value) || 25));
                    this.config.pomodoroMinutes = val;
                    e.target.value = val;
                    if (!this.state.isRunning && !this.state.isBreak) {
                        this.state.timeLeft = val * 60;
                        this.state.totalTime = this.state.timeLeft;
                        this.updateDisplay();
                    }
                    this.saveData();
                });

                this.dom.shortBreakInput.addEventListener('change', (e) => {
                    const val = Math.max(1, Math.min(60, parseInt(e.target.value) || 5));
                    this.config.shortBreakMinutes = val;
                    e.target.value = val;
                    this.saveData();
                });

                this.dom.longBreakInput.addEventListener('change', (e) => {
                    const val = Math.max(1, Math.min(120, parseInt(e.target.value) || 15));
                    this.config.longBreakMinutes = val;
                    e.target.value = val;
                    this.saveData();
                });

                this.dom.volumeSlider.addEventListener('input', (e) => {
                    this.state.volume = parseInt(e.target.value) / 100;
                    this.dom.volumeValue.textContent = Math.round(this.state.volume * 100) + '%';
                    this.saveData();
                });

                this.dom.muteBtn.addEventListener('click', () => {
                    this.state.volume = this.state.volume > 0 ? 0 : 0.5;
                    this.dom.volumeSlider.value = this.state.volume * 100;
                    this.dom.volumeValue.textContent = Math.round(this.state.volume * 100) + '%';
                    this.dom.muteBtn.textContent = this.state.volume > 0 ? '🔊' : '🔇';
                    this.saveData();
                });

                this.dom.fullscreenBtn.addEventListener('click', () => {
                    this.dom.fullscreenMode.classList.add('active');
                });

                this.dom.fullscreenClose.addEventListener('click', () => {
                    this.dom.fullscreenMode.classList.remove('active');
                });

                this.dom.tabButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const tab = e.target.dataset.tab;
                        this.switchTab(tab);
                    });
                });

                this.dom.resetStatsBtn.addEventListener('click', () => {
                    this.state.sessionsCompleted = 0;
                    this.state.focusTimeToday = 0;
                    this.state.dayStreak = 0;
                    this.saveData();
                    this.updateStats();
                    this.showNotification('Stats reset!');
                });

                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.state.isRunning ? this.pause() : this.start();
                    }
                    if (e.code === 'KeyR') {
                        this.reset();
                    }
                });
            },

            switchTab(tabName) {
                this.dom.tabContents.forEach(content => content.classList.remove('active'));
                this.dom.tabButtons.forEach(btn => btn.classList.remove('active'));

                document.getElementById(tabName + 'Tab').classList.add('active');
                document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

                if (tabName === 'stats') {
                    this.updateStats();
                }
            },

            updateDisplay() {
                const mins = Math.floor(this.state.timeLeft / 60);
                const secs = this.state.timeLeft % 60;
                const timeStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

                this.dom.timerValue.textContent = timeStr;
                this.dom.fullscreenTimer.textContent = timeStr;

                const modeText = this.state.isBreak
                    ? (this.state.isLongBreak ? 'Long Break' : 'Short Break')
                    : 'Focus Time';

                this.dom.timerMode.textContent = modeText;
                this.dom.fullscreenLabel.textContent = modeText;

                if (this.state.isBreak) {
                    this.dom.timerValue.classList.add('break');
                    this.dom.fullscreenTimer.classList.add('break');
                } else {
                    this.dom.timerValue.classList.remove('break');
                    this.dom.fullscreenTimer.classList.remove('break');
                }

                document.title = timeStr + ' - Pomodoro';
            },

            start() {
                if (this.state.isRunning) return;

                this.state.isRunning = true;
                this.dom.startBtn.style.display = 'none';
                this.dom.pauseBtn.style.display = 'block';

                this.countdownInterval = setInterval(() => {
                    this.state.timeLeft--;

                    if (this.state.timeLeft <= 0) {
                        this.complete();
                    }

                    this.updateDisplay();
                }, 1000);

                this.saveData();
            },

            pause() {
                this.state.isRunning = false;
                this.dom.startBtn.style.display = 'block';
                this.dom.pauseBtn.style.display = 'none';
                clearInterval(this.countdownInterval);
                this.saveData();
            },

            reset() {
                clearInterval(this.countdownInterval);
                this.state.isRunning = false;
                this.state.isBreak = false;
                this.state.isLongBreak = false;
                this.state.timeLeft = this.config.pomodoroMinutes * 60;
                this.state.totalTime = this.state.timeLeft;
                this.dom.startBtn.style.display = 'block';
                this.dom.pauseBtn.style.display = 'none';
                this.updateDisplay();
                this.saveData();
            },

            complete() {
                clearInterval(this.countdownInterval);
                this.state.isRunning = false;
                this.dom.startBtn.style.display = 'block';
                this.dom.pauseBtn.style.display = 'none';

                if (!this.state.isBreak) {
                    this.state.focusTimeToday += this.config.pomodoroMinutes;
                    this.state.sessionsCompleted++;

                    const isLongBreak = this.state.sessionsCompleted % this.config.sessionsUntilLongBreak === 0;
                    this.state.isLongBreak = isLongBreak;
                    this.state.isBreak = true;

                    const breakTime = isLongBreak 
                        ? this.config.longBreakMinutes 
                        : this.config.shortBreakMinutes;

                    this.state.timeLeft = breakTime * 60;
                    this.state.totalTime = this.state.timeLeft;

                    const msg = isLongBreak ? 'Time for a long break!' : 'Time for a short break!';
                    this.showNotification(msg);
                } else {
                    this.state.isBreak = false;
                    this.state.isLongBreak = false;
                    this.state.timeLeft = this.config.pomodoroMinutes * 60;
                    this.state.totalTime = this.state.timeLeft;
                    this.showNotification('Break over! Time to focus.');
                }

                this.updateDisplay();
                this.saveData();
            },

            updateStats() {
                this.dom.sessionsCount.textContent = this.state.sessionsCompleted;
                this.dom.focusTime.textContent = this.state.focusTimeToday + 'm';
                this.dom.streakCount.textContent = this.state.dayStreak;

                const avg = this.state.sessionsCompleted > 0
                    ? Math.round(this.state.focusTimeToday / this.state.sessionsCompleted)
                    : this.config.pomodoroMinutes;
                this.dom.avgTime.textContent = avg + 'm';
            },

            showNotification(msg) {
                this.dom.notification.textContent = msg;
                this.dom.notification.classList.add('show');
                setTimeout(() => {
                    this.dom.notification.classList.remove('show');
                }, 3000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
